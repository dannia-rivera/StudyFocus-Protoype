<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyFocus • Milestone 2 Interactive Prototype</title><style>
:root{--bg:#f7f7fc;--ink:#20243d;--muted:#787e94;--purple:#7161c7;--purple2:#ece9fb;--border:#e6e5f0;--white:#fff;--green:#339c77;--peach:#fff0e5}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b6a7fe;outline-offset:2px}.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--border);padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:22px;letter-spacing:-.7px;margin:4px 11px 42px}.brand span{color:var(--purple)}.nav{display:grid;gap:10px}.nav button{text-align:left;border:0;background:transparent;padding:13px 15px;border-radius:12px;color:#5e657f;font-weight:600}.nav button.active{background:var(--purple2);color:#5445af}.nav button:hover{background:#f2f0fa}.aside-note{margin-top:auto;background:#f8f7fd;border:1px dashed #ccc5ee;padding:14px;border-radius:12px;color:#77718e;font-size:12px}.main{padding:26px 5vw 60px;max-width:1250px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.eyebrow{color:var(--purple);font-weight:700;font-size:12px;letter-spacing:1.7px;text-transform:uppercase}.profile{background:#eeebfc;color:#7566c0;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;font-weight:700}h1{font-size:clamp(27px,4vw,38px);line-height:1.2;letter-spacing:-1px;margin:0 0 9px}h2{font-size:19px;margin:0 0 20px}p{color:var(--muted);margin:0 0 22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--border);box-shadow:0 6px 25px #28204a08;border-radius:19px;padding:25px}.stat{font-size:31px;font-weight:800;letter-spacing:-1px;margin:7px 0}.label{font-weight:700;font-size:13px;color:#73788d}.progress{height:11px;border-radius:50px;background:#eeeef5;overflow:hidden;margin:17px 0 8px}.progress>div{height:100%;background:#8a77e1;transition:width .3s}.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:22px}.action{border:0;border-radius:17px;text-align:left;min-height:140px;padding:25px;font-weight:750;font-size:19px;background:#eae5fb;color:#5b48af}.action small{display:block;font-size:13px;font-weight:500;margin-top:8px}.action.peach{background:var(--peach);color:#9a6544}.btn{border:1px solid var(--border);background:#fff;color:#444965;border-radius:11px;padding:11px 18px;font-weight:700}.btn.primary{background:var(--purple);border-color:var(--purple);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.btn:hover:not(:disabled){filter:brightness(.97)}.controls{display:flex;gap:11px;flex-wrap:wrap;align-items:center;justify-content:center}.timer-area{text-align:center}.ring{height:255px;width:255px;border-radius:50%;margin:20px auto 28px;display:grid;place-items:center;background:conic-gradient(#796bd2 var(--percent,0%),#eeecf7 0);padding:15px}.ring-inner{height:100%;width:100%;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center}.clock{font-size:55px;font-weight:800;letter-spacing:-2px;line-height:1.2}.pill-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 20px}.pill{border-radius:50px;background:#f4f2fa;border:1px solid #e7e3f5;padding:9px 17px;color:#71638d}.pill.active{background:#e5defb;color:#51429c;border-color:#c7baf5}.camera-box{height:310px;border-radius:16px;background:#292b40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#c5c8da;overflow:hidden;position:relative}.avatar{border:3px solid #aaa9c3;border-radius:50%;width:74px;height:74px;position:relative;margin-top:-30px}.avatar:after{content:"";position:absolute;top:69px;left:-32px;width:132px;height:100px;border:3px solid #aaa9c3;border-radius:90px 90px 0 0}.camera-box .camera-caption{position:absolute;bottom:16px;left:20px;font-size:13px}.camera-frame{position:absolute;width:160px;height:180px;border:2px dashed #85cfaf;border-radius:15px}.stack{display:grid;gap:10px;align-content:start}.status{background:#f5f5fb;border:1px solid var(--border);border-radius:13px;padding:17px;margin-top:16px}.dot{display:inline-block;background:#9da1b6;width:9px;height:9px;border-radius:50%;margin-right:7px}.dot.green{background:#31a67c}.feed{font-size:13px;background:#f8f9fc;border:1px solid var(--border);padding:16px;border-radius:12px;line-height:2;margin-top:18px}.metric{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.metric:last-child{border-bottom:0}.history-chart{height:220px;display:flex;gap:14px;align-items:end;justify-content:space-around;padding:20px 8px;border-bottom:1px solid var(--border)}.bar{width:42px;max-width:11%;background:#b7a9ef;border-radius:9px 9px 0 0;position:relative}.bar span{position:absolute;bottom:-30px;width:100%;left:0;text-align:center;font-size:12px;color:var(--muted)}.session-row{border-bottom:1px solid var(--border);padding:16px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.demo-note{background:#fff8e9;border:1px solid #f5ddaa;padding:12px 16px;border-radius:12px;color:#8a6a36;font-size:12px;margin-top:24px}input[type=number]{width:86px;padding:7px 10px;border:1px solid var(--border);border-radius:8px}.hidden{display:none!important}footer{margin-top:32px;font-size:12px;color:#a2a4b1}@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{padding:15px;position:static}.brand{margin:0 0 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.aside-note{display:none}.main{padding:22px}.grid2,.grid3,.hero-actions{grid-template-columns:1fr}.card{padding:19px}.ring{height:215px;width:215px}.clock{font-size:45px}}

/* Milestone 2 visual refinement */
:root{--bg:#f7f8ff;--ink:#22223d;--muted:#797e98;--purple:#7664d7;--purple2:#efebff;--border:#e7e6f3;--green:#2d9d83;--peach:#fff0e5}
body{background:radial-gradient(circle at 88% 10%,#eee8ff 0,transparent 33%),linear-gradient(160deg,#f9faff,#f6f7fc 50%,#fefaff);min-height:100vh}
.sidebar{background:linear-gradient(180deg,#fff 0%,#faf9ff 100%);padding-top:31px;box-shadow:4px 0 25px #392e6206}
.brand{font-size:23px;margin-bottom:32px}.brand:after{content:'YOUR STUDY SPACE';display:block;margin-top:2px;color:#aaa4c5;font-size:9px;letter-spacing:2.3px;font-weight:800}
.nav button{transition:background .2s,transform .2s;border:1px solid transparent}.nav button.active{background:#eee9ff;border-color:#ded5ff;box-shadow:inset 3px 0 #816be0}.nav button:hover{transform:translateX(3px)}
.main{max-width:1360px;padding-top:32px}.top{padding-bottom:22px;border-bottom:1px solid #e4e2ef;margin-bottom:29px}.profile{width:43px;height:43px;border:3px solid #fff;box-shadow:0 2px 8px #6a56bb27;background:linear-gradient(145deg,#ddd4ff,#a79be5);color:#4b3c83}
h1{font-weight:850;font-size:clamp(30px,3.5vw,44px);margin-bottom:11px}h2{font-weight:800;font-size:20px}.card{border-radius:21px;box-shadow:0 12px 32px #4e43800a;transition:box-shadow .2s}.card:hover{box-shadow:0 16px 36px #4e438014}.grid2{gap:19px}.stat{color:#3b366f;font-size:35px}.label{letter-spacing:1px;font-size:11px}
.progress{height:12px;background:#ececf5}.progress>div{background:linear-gradient(90deg,#7562d4,#ac9af1)}
.hero-actions{gap:18px}.action{position:relative;overflow:hidden;min-height:150px;border:1px solid #dbd3fb;background:linear-gradient(135deg,#e5ddff,#f4f0ff);box-shadow:0 8px 20px #7161c718;transition:transform .2s,box-shadow .2s}.action:after{content:'↗';position:absolute;right:25px;top:19px;font-size:22px;opacity:.55}.action:hover{transform:translateY(-3px);box-shadow:0 15px 30px #7161c726}.action.peach{border-color:#f2dfcd;background:linear-gradient(135deg,#ffeddf,#fff8ee)}
.btn{transition:transform .15s,filter .15s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn.primary{background:linear-gradient(135deg,#7563d5,#8b77e5);box-shadow:0 4px 10px #7664d72b}.ring{box-shadow:0 0 0 8px #f8f6ff,0 10px 26px #7563d519}.pill.active{box-shadow:0 3px 10px #7664d71a}
.camera-box{background:radial-gradient(circle at 50% 30%,#4f4b72,#28293e 68%);border:1px solid #5f5a82}.status{background:#f7f8ff}.feed{border-left:3px solid #a99bef;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.history-chart{background:repeating-linear-gradient(to top,transparent 0,transparent 49px,#eae8f3 50px);border-radius:12px}.bar{background:linear-gradient(to top,#7d6adb,#b9aaef)}
.demo-note{background:#fff9eb}.aside-note{font-size:11px;line-height:1.7;background:#f0edff;border-color:#d8d1f9;color:#7364a0}
.content-kicker{display:inline-flex;align-items:center;gap:8px;background:#f0ebff;color:#6c58c9;border:1px solid #e2dcfc;border-radius:999px;padding:6px 11px;margin-bottom:14px;font-size:11px;font-weight:800;letter-spacing:.4px}.subsection{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:29px 0 15px}.subsection h2{margin:0}.section-note{font-size:12px;color:#9a9cb0}.mini-row{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:20px}.mini-tile{background:#f8f7ff;border:1px solid #ece9f8;border-radius:14px;padding:13px 14px}.mini-tile b{display:block;font-size:16px;color:#5546aa}.mini-tile span{display:block;font-size:11px;color:#87849d}.study-tip{margin-top:18px;padding:14px 17px;border-radius:13px;background:linear-gradient(100deg,#f0f8f6,#f8fffc);border:1px solid #dcece7;color:#478073;font-size:13px}.tag-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:100px;background:#eff8f4;color:#2a8b72;font-weight:700;font-size:11px}.tag-chip.purple{background:#f0edff;color:#6a58c9}.step-card{padding:14px 16px;background:#faf9ff;border:1px solid #efecfb;border-radius:13px;margin-top:11px;display:flex;gap:12px;align-items:flex-start}.step-num{background:#ebe6ff;color:#6f5acb;font-weight:800;padding:5px 10px;border-radius:9px}.step-card b{display:block;font-size:13px}.step-card small{font-size:12px;color:#8a8aa0}.callout{display:flex;gap:11px;align-items:center;background:#f7f3ff;border:1px solid #e9e0ff;padding:12px 16px;border-radius:13px;color:#6f62a7;margin:17px 0;font-size:13px}
@media(max-width:780px){.mini-row{grid-template-columns:1fr}.main{padding:22px}.section-note{display:none}.top{margin-bottom:24px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">🎓 Study<span>Focus</span></div><nav class="nav" id="nav"><button data-page="home" class="active">⌂ &nbsp; Home</button><button data-page="timer">◷ &nbsp; Timer</button><button data-page="camera">▣ &nbsp; Camera</button><button data-page="history">▥ &nbsp; Stats</button><button data-page="settings">⚙ &nbsp; Settings</button></nav><div class="aside-note">✦ MILESTONE 2<br><b>REFINED INTERACTIVE PROTOTYPE</b><br><br>Click through the study flow. Camera tracking uses simulated data for the classroom demo.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">✦ Studying Effectively</div><div style="font-size:12px;color:#9a9bb0;margin-top:4px">Your personal focus workspace · Milestone 2 prototype</div></div><div class="profile">DR</div></header><div id="view"></div><footer>StudyFocus • HCI project • refined digital prototype</footer></main></div><script>
const view=document.querySelector('#view');let page='home',goal=240,completed=120,streak=3,seconds=1500,mode='focus',running=false,ticker=null,camera=false,calibrated=false,tracking='Waiting for camera…',interruptions=0,historyTab='Daily',demoSeconds=18.4,awaySeconds=8,screenPercent=92,sessionDone=false;
const durations={focus:1500,short:300,long:900};const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;const progress=()=>Math.min(100,Math.round(completed/goal*100));function navigate(p){page=p;render()}function button(text,action,kind=''){return `<button class="btn ${kind}" data-action="${action}">${text}</button>`};function card(v){return `<div class="card">${v}</div>`};function header(t,s){return `<h1>${t}</h1><p>${s}</p>`};function bar(p){return `<div class="progress"><div style="width:${p}%"></div></div>`};function cameraPanel(){return `<div class="camera-box">${calibrated?'<div class="camera-frame"></div>':''}<div class="avatar"></div><div class="camera-caption">${camera?'● Camera demonstration active':'◯ Camera inactive'}</div></div>`};function statusLine(){return `<div class="status"><b><span class="dot ${calibrated?'green':''}"></span>Tracking Status</b><div style="color:var(--muted);margin-top:6px">${tracking}</div></div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='live'&&b.dataset.page==='camera')||(page==='summary'&&b.dataset.page==='history')));if(page==='home')view.innerHTML=`<div class="content-kicker">✦ YOUR STUDY DASHBOARD</div>`+header('Welcome back!','Small steps lead to better study habits. Ready for a productive session?')+`<div class="grid2">${card(`<div class="label">DAILY GOAL</div><div class="stat">${completed} / ${goal} min</div>${bar(progress())}<div style="color:var(--muted);font-size:13px">${progress()}% of today's goal</div>`)}${card(`<div class="label">🔥 STUDY STREAK</div><div class="stat">${streak} days</div><p style="margin:0">Keep building your study habit!</p>`)}</div><div class="subsection"><h2>Quick actions</h2><span class="section-note">Choose how you want to begin</span></div><div class="hero-actions"><button class="action" data-action="start-focus">▶ &nbsp; Start Focus Session<small>25 minute focus timer</small></button><button class="action peach" data-action="start-break">☕ &nbsp; Take a Break<small>5 or 15 minutes</small></button></div><div class="mini-row"><div class="mini-tile"><b>⏱ 25 min</b><span>recommended focus block</span></div><div class="mini-tile"><b>☕ 5 min</b><span>short recharge</span></div><div class="mini-tile"><b>✓ 50%</b><span>sample daily progress</span></div></div><div class="study-tip">💡 Study tip: break larger assignments into short sessions. A quick break can help you reset.</div>`;
else if(page==='timer'){let pct=(1-seconds/durations[mode])*100;view.innerHTML=`<div class="content-kicker">◷ TIMER & BREAKS</div>`+header(mode==='focus'?'Focus Session':'Break Time','Set aside distraction-free time, then take a break when you need one.')+card(`<div class="timer-area"><div class="pill-row"><button class="pill ${mode==='focus'?'active':''}" data-action="focus">Focus · 25 min</button><button class="pill ${mode==='short'?'active':''}" data-action="short">5 Min Break</button><button class="pill ${mode==='long'?'active':''}" data-action="long">15 Min Break</button></div><div class="ring" style="--percent:${pct}%"><div class="ring-inner"><div class="clock" id="clock">${format(seconds)}</div><div class="label">${mode==='focus'?'Focus Time':'Break Time'}</div></div></div><div class="controls">${button('▶ Start','start','primary')}${button('Ⅱ Pause','pause')}${button('↻ Reset','reset')}${button('End & See Summary','finish')}</div><p style="margin-top:23px;font-size:13px">For the demo, use “End & See Summary” without waiting 25 minutes.</p><div class="callout" style="justify-content:center">🌿 Keep it manageable: try one focused session at a time.</div></div>`)}
else if(page==='camera')view.innerHTML=`<div class="content-kicker">▣ CAMERA SETUP</div>`+header('Camera & Focus Tracking','Follow the setup steps to explore how attention feedback could work.')+`<div class="grid2">${card(cameraPanel()+statusLine())}${card(`<h2>Camera Controls</h2><div class="tag-chip purple">PROTOTYPE MODE</div><div class="step-card"><span class="step-num">1</span><div><b>Start camera</b><small>Enable the preview for your session</small></div></div><div class="step-card"><span class="step-num">2</span><div><b>Calibrate</b><small>Face your screen for two seconds</small></div></div><div class="step-card"><span class="step-num">3</span><div><b>Begin tracking</b><small>View the simulated focus feedback</small></div></div><div class="stack" style="margin-top:16px">${button('Start Camera','camera-start','primary')}${button('Calibrate (2 seconds)','calibrate')}${button('Stop Camera','camera-stop')}${button('Continue to Live Session →','go-live')}</div><div class="demo-note">Prototype interaction: camera controls and calibration are simulated here. No webcam feed is captured or analyzed.</div>`)}</div>`;
else if(page==='live')view.innerHTML=`<div class="content-kicker">● LIVE SESSION PREVIEW</div>`+header('Live Session','A walkthrough of how the focus indicators could respond during studying.')+`<div class="callout">👀 Use “Simulate Looking Away” and “Simulate Return” to demonstrate how the interface responds.</div>`+`<div class="grid2">${card(cameraPanel()+`<div class="status"><span class="dot green"></span>${calibrated?'Tracking demo active':'Preview demo'}</div>`)}${card(`<h2>Current Session</h2><div class="metric"><span>Screen Facing</span><b>${screenPercent}%</b></div>${bar(screenPercent)}<div class="metric"><span>Interruptions</span><b>${interruptions}</b></div><div class="metric"><span>Longest Away</span><b>${awaySeconds} sec</b></div><div class="metric"><span>Total Screen Time</span><b>${demoSeconds} min</b></div>`)}</div>${card(`<h2>Session Log (demo)</h2><div class="feed" id="logs">6:42:10 PM &nbsp; Screen detected<br>6:42:18 PM &nbsp; Looked away (2 sec)<br>6:43:05 PM &nbsp; Screen detected</div><div class="controls" style="margin-top:18px">${button('Simulate Looking Away','away')}${button('Simulate Return','return')}${button('Finish Session →','finish','primary')}</div>`)}`;
else if(page==='summary')view.innerHTML=`<div class="content-kicker">★ YOUR SESSION RECAP</div>`+header('🎉 Session Complete!','Nice work showing up. Here’s an example of your session results.')+`<div class="grid2">${card(`<div class="label">TOTAL STUDY TIME</div><div class="stat">25:00</div>`)}${card(`<div class="label">SCREEN FACING · DEMO</div><div class="stat">${screenPercent}%</div>`) }${card(`<div class="label">INTERRUPTIONS · DEMO</div><div class="stat">${interruptions}</div>`)}${card(`<div class="label">LONGEST AWAY · DEMO</div><div class="stat">${awaySeconds} sec</div>`)}</div><div class="controls" style="margin-top:24px">${button('Download Demo Summary JSON','download','primary')}${button('Back to Home','home')}${button('See Study History','history')}</div><div class="demo-note">Camera and interruption statistics are sample prototype data, not measurements from actual detection.</div>`;
else if(page==='history'){let vals=historyTab==='Daily'?[32,63,44,78,54,90,65]:historyTab==='Weekly'?[44,67,79,55,86,74,90]:[65,40,70,83,62,95,78];view.innerHTML=`<div class="content-kicker">▥ YOUR STUDY INSIGHTS</div>`+header('Study History','Explore trends over time and celebrate your progress.')+card(`<div class="pill-row" style="justify-content:flex-start"><button class="pill ${historyTab==='Daily'?'active':''}" data-action="daily">Daily</button><button class="pill ${historyTab==='Weekly'?'active':''}" data-action="weekly">Weekly</button><button class="pill ${historyTab==='Monthly'?'active':''}" data-action="monthly">Monthly</button></div><div class="history-chart">${vals.map((v,i)=>`<div class="bar" style="height:${v}%"><span>${historyTab==='Daily'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]:historyTab==='Weekly'?'W'+(i+1):'M'+(i+1)}</span></div>`).join('')}</div><h2 style="margin-top:50px">Recent Sessions</h2>${[['Oct 21, 2026','25 min','91%','3 interruptions'],['Oct 20, 2026','50 min','88%','5 interruptions'],['Oct 19, 2026','25 min','94%','1 interruption']].map(a=>`<div class="session-row"><b>${a[0]}</b><span>${a.slice(1).join(' · ')}</span></div>`).join('')}<div class="demo-note">History data is illustrative for the prototype.</div>`)}
else if(page==='settings')view.innerHTML=`<div class="content-kicker">⚙ PREFERENCES</div>`+header('Settings','Set a goal that fits your schedule.')+card(`<h2>Daily Study Goal</h2><p>Choose how many minutes you want to study each day.</p><label>Minutes per day &nbsp;<input type="number" min="1" max="1440" id="goal" value="${goal}"></label><div style="margin-top:20px">${button('Save Goal','save-goal','primary')}</div>`)}
function stop(){running=false;clearInterval(ticker);ticker=null}function finish(){stop();if(!sessionDone){completed+=25;sessionDone=true}page='summary';render()}document.addEventListener('click',e=>{let n=e.target.closest('button');if(!n)return;if(n.dataset.page){navigate(n.dataset.page);return}switch(n.dataset.action){case 'start-focus':mode='focus';seconds=1500;sessionDone=false;navigate('timer');break;case 'start-break':mode='short';seconds=300;navigate('timer');break;case 'focus':case 'short':case 'long':stop();mode=n.dataset.action;seconds=durations[mode];navigate('timer');break;case 'start':if(running)return;running=true;ticker=setInterval(()=>{seconds--;let clock=document.querySelector('#clock');if(clock)clock.textContent=format(Math.max(0,seconds));if(seconds<=0){finish()}},1000);break;case 'pause':stop();break;case 'reset':stop();seconds=durations[mode];render();break;case 'finish':finish();break;case 'camera-start':camera=true;tracking='Camera ready · not calibrated (demo)';render();break;case 'calibrate':camera=true;calibrated=true;tracking='Screen facing · demo calibrated';render();break;case 'camera-stop':camera=false;calibrated=false;tracking='Waiting for camera…';render();break;case 'go-live':navigate('live');break;case 'away':interruptions++;awaySeconds=Math.max(awaySeconds,8);screenPercent=Math.max(60,screenPercent-3);tracking='Looking away · simulated';render();break;case 'return':tracking='Screen facing · simulated';render();break;case 'home':navigate('home');break;case 'history':navigate('history');break;case 'daily':case 'weekly':case 'monthly':historyTab=n.dataset.action[0].toUpperCase()+n.dataset.action.slice(1);render();break;case 'save-goal':goal=Math.max(1,parseInt(document.querySelector('#goal').value,10)||240);navigate('home');break;case 'download':let data={type:'simulated demo summary',study_minutes:25,screen_facing_percent_demo:screenPercent,interruptions_demo:interruptions,longest_away_seconds_demo:awaySeconds};let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));link.download='studyfocus-demo-summary.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);break}});render();
</script></body></html>
